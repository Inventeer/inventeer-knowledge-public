name: Layout Check

# Calls the layout check on every pull request (HUB_Repo_Layout_Standard
# section 9.3). This repo is public, and GitHub shares a private reusable
# workflow with private repos only, so it calls the public copy of the Hub's
# bootstrap in Inventeer/tool-confidentiality-gate, which a Hub check keeps
# equal to the Hub's. The check's script and every rule live in the Hub: the
# rules in HUB_Repo_Layout_Schema.json, and this repo's type in the tenant
# configuration, so this caller passes no setting of its own. What the check
# reports: Inventeer/inventeer-hub .github/workflows/layout-check.yml.
#
# Warning mode: a finding appears as a warning on the pull request and never
# blocks the merge, while the layout transition is open. The check reads no
# credential for a pull request opened from a fork; push the branch to this
# repo to have it checked.
#
# Run by hand (Actions -> Layout Check -> Run workflow) to check every tracked
# file of the chosen branch, required folders included.

on:
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs when a PR is updated.
concurrency:
  group: layout-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Check name: "layout / layout-check".
  layout:
    uses: Inventeer/tool-confidentiality-gate/.github/workflows/layout-check.yml@main
    with:
      hub_reader_app_id: ${{ vars.HUB_READER_APP_ID }}
      scan: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'diff' }}
    secrets:
      HUB_READER_APP_PRIVATE_KEY: ${{ secrets.HUB_READER_APP_PRIVATE_KEY }}
